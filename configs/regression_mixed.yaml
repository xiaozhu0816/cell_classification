# Regression-Only Training: MIXED infected + uninfected samples
#
# Goal:
#   Train a single-task regression model on BOTH infected and uninfected samples
#   in a single run, using the condition-specific time definition:
#     - infected:     time = hours_since_start - infection_onset_hour (clipped at >=0)
#     - uninfected:   time = hours_since_start
#
# This baseline answers: "If we remove the classification head, can a single
# regression head trained on mixed conditions learn appropriate progression time?"
#
# NOTE:
#   This is NOT identical to the multitask setup because regression-only does not
#   explicitly encourage separation of infection state; it relies on visual cues
#   to infer time under two different time semantics.

experiment_name: regression_mixed
seed: 42

# ============ Data Configuration ============
data:
  infected_dir: "/isilon/datalake/gurcan_rsch/scratch/WSI/zhengjie/DATA/GMU_cell_1023/HBMVEC/Infected_well/no_labels"
  uninfected_dir: "/isilon/datalake/gurcan_rsch/scratch/WSI/zhengjie/DATA/GMU_cell_1023/HBMVEC/Uninfected_well/no_labels"

  infected_label: 1
  uninfected_label: 0

  split_ratios: [0.7, 0.1, 0.2]
  split_seed: 123

  batch_size: 128
  eval_batch_size_multiplier: 2
  num_workers: 4
  drop_last: false

  transforms:
    image_size: 512
    # Match final multitask setting: remove 5% border on each side before resizing
    crop_border_fraction: 0.05
    random_flip: true
    random_rotation: true
    color_jitter: false
    mean: [0.5, 0.5, 0.5]
    std: [0.25, 0.25, 0.25]

  # MIXED: use both infected and uninfected windows
  frames:
    frames_per_hour: 2.0
    infected_window_hours: [1, 48]
    infected_stride: 1
    uninfected_window_hours: [0, 48]
    uninfected_stride: 1
    uninfected_use_all: true

# ============ Regression Configuration ============
regression:
  # Mixed training: keep both classes
  target_class: null  # null = all samples, 0 = uninfected only, 1 = infected only

  # Infection onset
  infection_onset_hour: 1.0

  # Clamp regression targets/predictions to valid range
  clamp_range: [0.0, 48.0]

# ============ Model Configuration ============
model:
  name: resnet50
  pretrained: true
  dropout: 0.2
  train_backbone: true
  hidden_dim: 256

# ============ Training Configuration ============
training:
  epochs: 100
  amp: true
  grad_clip: 1.0

# ============ Optimizer Configuration ============
optimizer:
  lr: 0.0001
  weight_decay: 0.0001

# ============ Scheduler Configuration ============
scheduler:
  # Keep consistent with multitask: match to epochs
  t_max: 100
  eta_min: 0.000001

# ============ How to Run ============
#
# python train_regression_cv.py --config configs/regression_mixed.yaml --num-folds 5
#
# Expected output structure:
#   outputs/regression_mixed/YYYYMMDD-HHMMSS_5fold/
#
# Tip:
#   Compare against multitask and the class-specific regression baselines:
#   - outputs/regression_infected/...
#   - outputs/regression_uninfected/...
